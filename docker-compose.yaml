version: "3.9"

services:
    db:
        image: mysql:8.0
        container_name: soombrella-db
        restart: always
        ports:
            - "3307:3306"
        env_file:
            - .env.docker
        volumes:
            - mysql_data:/var/lib/mysql
        command: >
            --character-set-server=utf8mb4
            --collation-server=utf8mb4_general_ci

volumes:
    mysql_data:
